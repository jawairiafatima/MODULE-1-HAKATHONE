<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eBay - Clone (hero section)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
</head>
<body>

<header class="site-header py-3">
    <div class="container d-flex align-items-center justify-content-between">
        <div class="logo">e<span class="eb">b</span>ay</div>
        <form class="search-form d-none d-md-flex align-items-center" role="search">
            <input class="form-control me-2" type="search" placeholder="Search for anything" aria-label="Search">
            <select class="form-select me-2 d-none d-lg-block" style="width:200px;">
                <option>All Categories</option>
            </select>
            <button class="btn btn-primary">Search</button>
        </form>
        <div class="header-actions text-end">
            <a class="link-muted me-3" href="#">Sign in</a>
            <a class="btn btn-outline-dark btn-sm" href="#">Cart</a>
        </div>
    </div>
</header>

<main>
    <section class="hero">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 hero-copy text-white">
                    <h1>Save 20% on selected items</h1>
                    <p class="lead">Score savings this week on tech, fashion, home and more.</p>
                    <p><a class="btn btn-light btn-lg rounded-pill" href="#">Get the coupon</a></p>
                    <p class="small-text"><a class="link-light" href="#">Ends 2/16 PST. Max $500 off. 2x use.</a></p>
                </div>
                <div class="col-md-6">
                    <div class="cards-row d-flex justify-content-end align-items-center">
                        <div class="product-card">
                            <img src="https://images.unsplash.com/photo-1603791440384-56cd371ee9a7?q=80&w=800&auto=format&fit=crop&ixlib=rb-4.0.3&s=5b2e1d9c3b9d6f3a2c0b" alt="phone">
                        </div>
                        <div class="product-card">
                            <img src="https://images.unsplash.com/photo-1543168250-1b22c2a4b0d4?q=80&w=800&auto=format&fit=crop&ixlib=rb-4.0.3&s=7d6f3fbe2b5f4f3d6f7b" alt="bag">
                        </div>
                        <div class="product-card">
                            <img src="https://images.unsplash.com/photo-1519337265831-281ec6cc8514?q=80&w=800&auto=format&fit=crop&ixlib=rb-4.0.3&s=9f3a3f6b4c2d1a7e3c8b" alt="fan">
                        </div>
                    </div>
                    <div class="carousel-controls">
                        <div class="dots">
                            <span class="dot active"></span>
                            <span class="dot"></span>
                            <span class="dot"></span>
                        </div>
                        <div class="arrows">
                            <button class="arrow">❮</button>
                            <button class="arrow">❯</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</main>

<footer class="py-5 text-center">
    <div class="container">
        <p class="mb-0">Shopping made easy — clone demo</p>
    </div>
</footer>


                <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
